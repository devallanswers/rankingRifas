<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corrida da Rifa EAC 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1033;--yellow:#F5C800;--H:100px}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:#fff;min-height:100vh;overflow-x:hidden;
 background:linear-gradient(160deg,#1A3A6B 0%,#3b21a8 55%,#7b2bd9 100%);background-attachment:fixed}
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubbles i{position:absolute;bottom:-80px;border-radius:50%;opacity:.18;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(180deg)}}
main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px 14px 40px}

header{text-align:center;padding:10px 0 4px}
.live{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);padding:6px 14px;border-radius:99px;font-size:.85rem;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;background:#2EE66B;box-shadow:0 0 0 0 #2EE66B;animation:ping 1.6s infinite}
.dot.off{background:#ff5252;animation:none}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(46,230,107,0)}100%{box-shadow:0 0 0 0 rgba(46,230,107,0)}}
h1{font-size:clamp(2.1rem,8vw,3.6rem);font-weight:700;line-height:1;margin:14px 0 4px;color:var(--yellow);
 text-shadow:0 4px 0 #d4540a,0 8px 0 rgba(0,0,0,.25);letter-spacing:.5px}
.sub{font-weight:500;opacity:.9;font-size:1.05rem}

.hero{display:flex;align-items:center;gap:16px;margin:20px 0 12px;padding:14px 18px;border-radius:28px;
 background:linear-gradient(120deg,#FFD600,#FF8A00);color:var(--ink);box-shadow:0 10px 0 rgba(0,0,0,.2),0 0 40px rgba(255,214,0,.35)}
.hero .big{width:92px;height:92px;flex:none;animation:hop 1.1s ease-in-out infinite}
.hero small{font-weight:600;font-size:.95rem;opacity:.8}
.hero b{display:block;font-size:clamp(1.4rem,6vw,2.2rem);line-height:1.05}
.hero .hp{font-size:1.05rem;font-weight:600}
.hero.pop{animation:pop .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.9) rotate(-2deg)}100%{transform:none}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.25);border-radius:20px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:clamp(1.15rem,4.6vw,1.7rem);font-weight:700}
.stat span{font-size:.8rem;font-weight:500;opacity:.85}

#board{position:relative}
.lane{position:absolute;left:0;right:0;height:calc(var(--H) - 10px);display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;
 border-radius:26px;background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.22);
 transition:transform 1.1s cubic-bezier(.34,1.3,.5,1),background .6s,box-shadow .6s}
.lane.r1{background:linear-gradient(100deg,rgba(255,214,0,.4),rgba(255,138,0,.25));border-color:#FFD600;box-shadow:0 0 28px rgba(255,214,0,.45)}
.lane.r2{border-color:#dfe8ff}.lane.r3{border-color:#ffb27a}
.rk{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.35rem;font-weight:700;background:rgba(0,0,0,.28)}
.mid{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.nm{font-size:1.12rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:.82rem;opacity:.85;white-space:nowrap}
.track{position:relative;height:20px;border-radius:99px;background:rgba(0,0,0,.3)}
.fill{height:100%;border-radius:99px;width:4%;transition:width 1.4s cubic-bezier(.3,1.1,.4,1);
 background:repeating-linear-gradient(115deg,rgba(255,255,255,.28) 0 10px,transparent 10px 20px),linear-gradient(90deg,var(--c),var(--c2));
 background-size:40px 100%,100% 100%;animation:stripes 1.2s linear infinite}
@keyframes stripes{to{background-position:40px 0,0 0}}
.rider{position:absolute;top:-34px;width:52px;height:52px;left:4%;transform:translateX(-62%);transition:left 1.4s cubic-bezier(.3,1.1,.4,1)}
.rider svg{width:100%;height:100%;animation:hop .9s ease-in-out infinite;animation-delay:var(--d);overflow:visible}
.flag{position:absolute;right:-4px;top:-18px;font-style:normal;font-size:1.2rem}
.pc{flex:none;min-width:62px;text-align:right;font-size:1.55rem;font-weight:700}
@keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}45%{transform:translateY(-9px) scaleY(1.05)}80%{transform:translateY(0) scaleY(.92)}}
.r1 .rider svg{animation-duration:.6s}

footer{margin-top:18px;text-align:center}
.chip{display:inline-block;background:rgba(0,0,0,.28);border-radius:99px;padding:8px 16px;margin:4px;font-weight:500;font-size:.95rem}
.msg{margin-top:14px;font-weight:500;opacity:.9}
#toasts{position:fixed;top:12px;left:0;right:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#fff;color:var(--ink);font-weight:700;padding:10px 18px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.35);
 animation:tin .6s cubic-bezier(.3,1.6,.5,1),tout .5s 4.5s forwards;max-width:92vw;text-align:center}
@keyframes tin{from{transform:translateY(-60px) scale(.7);opacity:0}}
@keyframes tout{to{transform:translateY(-40px);opacity:0}}
.cf{position:fixed;top:-20px;width:10px;height:16px;z-index:19;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:480px){:root{--H:96px}.rk{width:36px;height:36px;font-size:1.1rem}.pc{font-size:1.25rem;min-width:50px}.hero .big{width:72px;height:72px}.lane{gap:7px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="bubbles" id="bubbles" aria-hidden="true"></div>
<div id="toasts" aria-live="polite"></div>
<main>
 <header>
  <span class="live"><span class="dot" id="dot"></span><span id="liveTxt">Conectando...</span></span>
  <h1>Corrida da Rifa</h1>
  <p class="sub">EAC 2026: quem vai cruzar a linha de chegada primeiro?</p>
 </header>

 <section class="hero" id="hero" aria-label="Equipe na frente">
  <div class="big" id="heroMascot"></div>
  <div><small>Na frente agora</small><b id="heroName">Carregando...</b><span class="hp" id="heroPct"></span></div>
 </section>

 <section class="stats">
  <div class="stat"><b id="sSold">0</b><span>números vendidos</span></div>
  <div class="stat"><b id="sPct">0%</b><span>da rifa vendida</span></div>
  <div class="stat"><b id="sMoney">R$ 0</b><span>arrecadados</span></div>
 </section>

 <section id="board" aria-label="Ranking das equipes"></section>

 <footer>
  <div id="chips"></div>
  <p class="msg" id="msg">Fique de olho: o ranking muda a cada venda!</p>
 </footer>
</main>

<script>
// ============ CONFIGURAÇÃO ============
// Se esta página for o "Index" do próprio Apps Script, não precisa mudar nada.
// Se estiver hospedada fora, cole aqui a URL do app da web (termina em /exec).
const API_URL = " https://script.google.com/macros/s/AKfycbyT84qHAgbhB1AtowdK0h3OJJBHbOD6GSMDDQGxlG2DUeZFN3q-X72T28v37NTcLvNjoQ/exec";
const REFRESH_SECONDS = 15;
// ======================================

const COLORS = ["#FF3D81","#FF8A00","#FFD600","#00D68F","#00B8FF","#9B6BFF","#FF5252","#26E3C2","#B2FF3D","#FF6EC7","#4D7CFF","#FFA63D"];
const MSGS = [
 "Fique de olho: o ranking muda a cada venda!",
 "Vendeu um número? Daqui a pouco sua equipe sobe aqui.",
 "Ainda dá tempo de virar o jogo!",
 "Cada número vendido ajuda o EAC acontecer.",
 "Quem será que vai ultrapassar o líder?"
];
const $ = id => document.getElementById(id);
const brl = n => "R$ " + Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:2});

/* ---------- personagens ---------- */
function mascot(i, mood, crown){
  const c = COLORS[i % 12], t = i % 6, ink = "#1b1033";
  const acc = [
    `<path d="M10 24 L12 4 L25 15Z M50 24 L48 4 L35 15Z" fill="${c}"/><path d="M14 18 L15 9 L21 14Z M46 18 L45 9 L39 14Z" fill="#fff" opacity=".6"/>`,
    `<circle cx="13" cy="16" r="8" fill="${c}"/><circle cx="47" cy="16" r="8" fill="${c}"/><circle cx="13" cy="16" r="4" fill="#fff" opacity=".6"/><circle cx="47" cy="16" r="4" fill="#fff" opacity=".6"/>`,
    `<ellipse cx="20" cy="9" rx="5" ry="12" fill="${c}"/><ellipse cx="40" cy="9" rx="5" ry="12" fill="${c}"/><ellipse cx="20" cy="10" rx="2.4" ry="8" fill="#fff" opacity=".6"/><ellipse cx="40" cy="10" rx="2.4" ry="8" fill="#fff" opacity=".6"/>`,
    `<path d="M30 16V5" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="30" cy="4" r="4" fill="#FFD600"/>`,
    `<path d="M13 20 Q6 6 19 9Z M47 20 Q54 6 41 9Z" fill="#fff"/>`,
    `<path d="M30 16 L30 8" stroke="#1DB954" stroke-width="3" stroke-linecap="round"/><path d="M30 9 Q21 0 17 8 Q25 13 30 9Z M30 9 Q39 0 43 8 Q35 13 30 9Z" fill="#2EE66B"/>`
  ][t];
  const showAcc = !(crown && (t === 3 || t === 5));
  const eyes = mood === "win"
    ? `<path d="M18 34 Q23 27 28 34 M32 34 Q37 27 42 34" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`
    : `<circle cx="23" cy="34" r="5" fill="#fff"/><circle cx="37" cy="34" r="5" fill="#fff"/><circle cx="24" cy="35" r="2.6" fill="${ink}"/><circle cx="38" cy="35" r="2.6" fill="${ink}"/>`;
  const mouth = mood === "win"
    ? `<path d="M23 41 Q30 53 37 41Z" fill="${ink}"/><path d="M26 47 Q30 50 34 47" fill="#FF6B8A"/>`
    : mood === "low"
    ? `<path d="M26 46 Q30 41 34 46" stroke="${ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`
    : `<path d="M25 42 Q30 48 35 42" stroke="${ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  const sweat = mood === "low" ? `<path d="M48 24 Q52 31 48 34 Q44 31 48 24Z" fill="#7fd8ff"/>` : "";
  const crownSvg = crown ? `<path d="M19 17 L21 4 L26 11 L30 2 L34 11 L39 4 L41 17Z" fill="#FFD600" stroke="#E6A200" stroke-width="1.5" stroke-linejoin="round"/>` : "";
  return `<svg viewBox="0 0 60 60" aria-hidden="true">${showAcc?acc:""}
    <ellipse cx="30" cy="37" rx="22" ry="20" fill="${c}" stroke="${ink}" stroke-opacity=".25" stroke-width="2"/>
    <ellipse cx="30" cy="44" rx="12" ry="9" fill="#fff" opacity=".25"/>
    ${eyes}${mouth}
    <circle cx="15" cy="42" r="3.4" fill="#ff6b8a" opacity=".55"/><circle cx="45" cy="42" r="3.4" fill="#ff6b8a" opacity=".55"/>
    ${sweat}${crownSvg}</svg>`;
}
function lighten(hex){
  const n = parseInt(hex.slice(1),16), f = v => Math.min(255, v + 70);
  return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`;
}

/* ---------- dados ---------- */
const DEMO = ["FAMÍLIAS","EQUIPE DE SALA","REFEIÇÃO","COMUNICAÇÃO","RECREIO","PAPELARIA","BODEGA","TEATRO","ANIMAÇÃO","ORAÇÃO","DECORAÇÃO","LIMPEZA"]
  .map((n,i)=>({nome:n,total:[200,350,180,170,200,180,200,190,170,170,150,180][i],vendidos:Math.floor(Math.random()*80)}));
function demoData(){
  DEMO.forEach(e=>{ e.vendidos = Math.min(e.total, e.vendidos + Math.floor(Math.random()*12)); });
  const eq = DEMO.map(e=>({nome:e.nome,total:e.total,vendidos:e.vendidos,arrecadado:e.vendidos*5}));
  return {ok:true,data:{info:{sorteio:"data do sorteio",premio:"prêmio da rifa",preco:5},equipes:eq,totais:{}}};
}
function fetchData(){
  return new Promise((res,rej)=>{
    if(window.google && google.script && google.script.run){
      google.script.run.withSuccessHandler(s=>{try{res(JSON.parse(s))}catch(e){rej(e)}}).withFailureHandler(rej).getDashboard();
    } else if(API_URL){
      fetch(API_URL + (API_URL.includes("?")?"&":"?") + "api=dashboard").then(r=>r.json()).then(res).catch(rej);
    } else { res(demoData()); }
  });
}
function normalize(raw){
  const d = raw.data, preco = Number(d.info.preco) || 5;
  const eq = d.equipes.filter(e=>e.nome).map((e,idx)=>{
    const total = Number(e.total)||0, vend = Number(e.vendidos)||0;
    return {idx, nome:String(e.nome), total, vend, pct: total>0 ? Math.min(1, vend/total) : 0,
            money: Number(e.arrecadado) || vend*preco, rk: Number(e.ranking)};
  });
  const useSheet = eq.length && eq.every(e=>isFinite(e.rk) && e.rk>0);
  eq.sort((a,b)=> (useSheet && a.rk!==b.rk) ? a.rk-b.rk : (b.pct-a.pct) || (b.vend-a.vend));
  return {eq, info:d.info};
}

/* ---------- animações ---------- */
function countTo(el, to, fmt){
  const from = Number(el.dataset.v||0); el.dataset.v = to;
  const t0 = performance.now(), dur = 1200;
  (function step(t){
    const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3);
    el.textContent = fmt(from + (to-from)*e);
    if(k<1) requestAnimationFrame(step);
  })(t0);
}
function toast(txt){
  const d = document.createElement("div"); d.className="toast"; d.textContent=txt;
  $("toasts").appendChild(d); setTimeout(()=>d.remove(),5200);
}
function confetti(){
  const cols = [...COLORS,"#fff"];
  for(let i=0;i<46;i++){
    const p = document.createElement("i"); p.className="cf";
    p.style.left = Math.random()*100+"vw"; p.style.background = cols[i%cols.length];
    p.style.animationDuration = (1.8+Math.random()*1.6)+"s"; p.style.animationDelay = Math.random()*.4+"s";
    p.style.borderRadius = i%3?"2px":"50%";
    document.body.appendChild(p); setTimeout(()=>p.remove(),4200);
  }
}

/* ---------- render ---------- */
const lanes = {}; let prevRank = null, prevLeader = null, first = true;
const board = $("board");

function render(raw){
  const {eq, info} = normalize(raw), n = eq.length;
  const H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--H")) || 100;
  board.style.height = n*H + "px";
  const newRank = {};
  eq.forEach((e,pos)=>{
    newRank[e.nome] = pos;
    let L = lanes[e.nome];
    if(!L){
      const el = document.createElement("div"); el.className="lane";
      el.innerHTML = `<div class="rk"></div><div class="mid"><div class="top"><span class="nm"></span><span class="st"></span></div>
        <div class="track"><div class="fill"></div><div class="rider"></div><i class="flag">🏁</i></div></div><div class="pc">0%</div>`;
      el.style.setProperty("--c",COLORS[e.idx%12]); el.style.setProperty("--c2",lighten(COLORS[e.idx%12]));
      el.querySelector(".nm").textContent = e.nome;
      el.querySelector(".rider").style.setProperty("--d",(-Math.random()*.9)+"s");
      el.style.transform = `translateY(${pos*H}px)`;
      board.appendChild(el);
      L = lanes[e.nome] = {el, mood:""};
    }
    const el = L.el, w = Math.max(4, e.pct*100);
    requestAnimationFrame(()=>{ el.style.transform = `translateY(${pos*H}px)`; });
    el.className = "lane" + (pos<3 ? " r"+(pos+1) : "");
    el.querySelector(".rk").textContent = pos===0?"🥇":pos===1?"🥈":pos===2?"🥉":pos+1;
    el.querySelector(".st").textContent = `${e.vend} de ${e.total}`;
    el.querySelector(".fill").style.width = w+"%";
    el.querySelector(".rider").style.left = w+"%";
    countTo(el.querySelector(".pc"), Math.round(e.pct*100), v=>Math.round(v)+"%");
    const mood = pos<3 ? "win" : pos>=n-3 ? "low" : "ok", key = mood+(pos===0);
    if(L.mood !== key){ el.querySelector(".rider").innerHTML = mascot(e.idx, mood, pos===0); L.mood = key; }
  });

  // líder
  const lead = eq[0];
  if(lead){
    $("heroName").textContent = lead.nome;
    $("heroPct").textContent = `${Math.round(lead.pct*100)}% vendido · ${lead.vend} números`;
    $("heroMascot").innerHTML = mascot(lead.idx,"win",true);
    if(prevLeader && prevLeader !== lead.nome){
      const h = $("hero"); h.classList.remove("pop"); void h.offsetWidth; h.classList.add("pop");
      toast(`👑 ${lead.nome} assumiu a liderança!`); confetti();
    }
    prevLeader = lead.nome;
  }

  // ultrapassagens
  if(prevRank){
    let shown = 0;
    eq.forEach(e=>{
      const o = prevRank[e.nome], nw = newRank[e.nome];
      if(o!==undefined && nw<o && shown<2 && !(nw===0)){
        const passed = eq.find(x=>prevRank[x.nome]!==undefined && prevRank[x.nome]<o && newRank[x.nome]>nw);
        if(passed){ toast(`🚀 ${e.nome} ultrapassou ${passed.nome}!`); shown++; }
      }
    });
  }
  prevRank = newRank;

  // totais
  const sold = eq.reduce((s,e)=>s+e.vend,0), tot = eq.reduce((s,e)=>s+e.total,0), money = eq.reduce((s,e)=>s+e.money,0);
  countTo($("sSold"), sold, v=>Math.round(v).toLocaleString("pt-BR"));
  countTo($("sPct"), tot? Math.round(sold/tot*100):0, v=>Math.round(v)+"%");
  countTo($("sMoney"), money, v=>brl(Math.round(v)));

  const chips = [];
  if(info.sorteio) chips.push("🎟️ Sorteio: "+info.sorteio);
  if(info.premio)  chips.push("🎁 Prêmio: "+info.premio);
  $("chips").innerHTML = ""; chips.forEach(t=>{const s=document.createElement("span"); s.className="chip"; s.textContent=t; $("chips").appendChild(s);});
  first = false;
}

/* ---------- ciclo de atualização ---------- */
let last = 0, busy = false, msgI = 0;
async function refresh(){
  if(busy) return; busy = true;
  try{
    const raw = await fetchData();
    if(!raw.ok) throw new Error(raw.error);
    render(raw); last = Date.now(); $("dot").classList.remove("off");
  }catch(e){
    $("dot").classList.add("off"); $("liveTxt").textContent = "Sem conexão. Tentando de novo...";
    console.error(e);
  }
  busy = false;
}
setInterval(()=>{
  if(document.hidden) return;
  const s = Math.round((Date.now()-last)/1000);
  if(last) $("liveTxt").textContent = s<3 ? "Ao vivo! Atualizado agora" : `Ao vivo · atualizado há ${s}s`;
  if(Date.now()-last > REFRESH_SECONDS*1000) refresh();
},1000);
setInterval(()=>{ msgI=(msgI+1)%MSGS.length; $("msg").textContent = MSGS[msgI]; },9000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(); });

// bolhas de fundo
(function(){
  const b = $("bubbles");
  for(let i=0;i<14;i++){
    const s = 20+Math.random()*70, d = document.createElement("i");
    d.style.cssText = `left:${Math.random()*100}%;width:${s}px;height:${s}px;background:${COLORS[i%12]};animation-duration:${14+Math.random()*16}s;animation-delay:${-Math.random()*20}s`;
    b.appendChild(d);
  }
})();
refresh();
</script>
</body>
</html>
